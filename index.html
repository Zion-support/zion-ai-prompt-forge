<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Zion AI Prompt Forge</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}label{display:block;margin:.4rem 0}select{padding:.4rem}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>🔨 Zion AI Prompt Forge</h1><p>Generate an engineering prompt template.</p><label>Task <select id="t"><option>Incident postmortem</option><option>Runbook generation</option><option>Code review</option><option>Capacity report</option></select></label><label>Tone <select id="o"><option>Technical, concise</option><option>Executive summary</option><option>Step-by-step tutorial</option></select></label><button onclick="go()">Forge prompt</button><div id="out"></div><script>function go(){const t=document.getElementById('t').value,o=document.getElementById('o').value;document.getElementById('out').textContent=`Prompt template (${o}):\n\n"You are a senior IT operations engineer. Task: ${t}.\nContext: [paste logs/data here]\nRequirements: be factual, cite timestamps, flag unknowns.\nOutput format: ${o==='Executive summary'?'5-bullet summary + risk rating':'structured markdown with sections: Summary, Timeline, Root cause, Action items'}"\n\nVersioned team prompt library: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/zion-ai-prompt-forge">GitHub</a> · <a href="https://ziontechgroup.com/ai-prompt-engineer/">Prompt Engineer</a></p></body></html>
